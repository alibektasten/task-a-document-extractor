[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docguard-extractor"
version = "0.1.0"
description = "Evidence-grounded document extraction for Task A"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
docguard = "docguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
